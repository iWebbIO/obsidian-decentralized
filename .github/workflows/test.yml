name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Node 18 dropped: it is past EOL, and the production build's minifier chain
        # requires the global crypto object introduced in Node 19.
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Check release file version sync
      # A PR that bumps one release file without the others passes CI silently; the
      # community registry then has no mapping for the shipped version.
      run: |
        node -e "
        const m = require('./manifest.json');
        const pkg = require('./package.json');
        const v = require('./versions.json');
        const fail = (msg) => { console.error(msg); process.exit(1); };
        if (m.version !== pkg.version) fail('manifest.json and package.json versions differ: ' + m.version + ' vs ' + pkg.version);
        if (v[m.version] !== m.minAppVersion) fail('versions.json has no mapping for ' + m.version);
        console.log('Release files in sync at ' + m.version);
        "

    - name: Type-check
      run: npm run typecheck

    - name: Run tests
      run: npm run test

    - name: Run simulation tests
      run: npm run test:simulation

    # The tests run against the TypeScript sources; only the bundle shows whether the
    # plugin still builds and still loads on mobile (no Node built-ins at load time).
    - name: Build plugin
      run: npm run build

    - name: Verify the bundle loads on mobile
      run: npm run test:mobile-load
